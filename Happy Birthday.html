<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 90%;
    max-width: 650px;
    padding: 35px;
    text-align: center;
    background: rgba(255,255,255,0.92);
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    z-index: 10;
}

h1 {
    color: #ff4081;
    font-size: 42px;
    margin: 10px 0;
}

p {
    color: #555;
    font-size: 19px;
    line-height: 1.7;
}

.cake {
    position: relative;
    width: 260px;
    height: 130px;
    margin: 25px auto 35px;
}

.layer {
    position: absolute;
    left: 20px;
    width: 220px;
    height: 60px;
    background: #ff8fab;
    border-radius: 15px 15px 20px 20px;
    bottom: 0;
    box-shadow: inset 0 -10px #ff6f91;
}

.cream {
    position: absolute;
    left: 20px;
    bottom: 48px;
    width: 220px;
    height: 30px;
    background: #fff;
    border-radius: 50%;
}

.candle {
    position: absolute;
    bottom: 75px;
    width: 15px;
    height: 55px;
    background: repeating-linear-gradient(
        45deg,
        #42a5f5,
        #42a5f5 7px,
        #fff 7px,
        #fff 14px
    );
    border-radius: 4px;
}

.candle:nth-child(1) { left: 65px; }
.candle:nth-child(2) { left: 122px; }
.candle:nth-child(3) { left: 179px; }

.flame {
    position: absolute;
    width: 18px;
    height: 25px;
    background: #ff9800;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    top: -27px;
    left: -2px;
    box-shadow: 0 0 15px #ff9800;
    animation: flicker 0.25s infinite alternate;
}

.flame.off {
    display: none;
}

@keyframes flicker {
    from { transform: rotate(-45deg) scale(1); }
    to { transform: rotate(-45deg) scale(1.15); }
}

button {
    border: none;
    padding: 13px 22px;
    margin: 7px;
    border-radius: 30px;
    color: white;
    background: #ff4081;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.08);
    background: #e91e63;
}

/* Balloons */
.balloon {
    position: fixed;
    bottom: -120px;
    width: 55px;
    height: 70px;
    border-radius: 50%;
    animation: floatUp 7s linear forwards;
    z-index: 5;
}

.balloon::after {
    content: "";
    position: absolute;
    bottom: -25px;
    left: 27px;
    width: 2px;
    height: 30px;
    background: #555;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(-5deg);
    }
    50% {
        transform: translateY(-50vh) rotate(5deg);
    }
    100% {
        transform: translateY(-120vh) rotate(-5deg);
    }
}

.pop {
    animation: pop 0.3s forwards !important;
}

@keyframes pop {
    to {
        transform: scale(2);
        opacity: 0;
    }
}

/* Confetti */
.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -20px;
    z-index: 100;
    animation: fall 3s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="card">

    <div style="font-size:50px;">🎈🎉🎈</div>

    <h1>HAPPY BIRTHDAY 🎂</h1>

    <p>
        Wishing you a very happy birthday, my dear friend! 💖<br>
        May your day be filled with happiness, fun and beautiful memories. ✨<br>
        Stay happy and keep smiling always! 😊<br>
        Once again, Happy Birthday! 🎉
    </p>

    <div class="cake">
        <div class="candle">
            <div class="flame"></div>
        </div>

        <div class="candle">
            <div class="flame"></div>
        </div>

        <div class="candle">
            <div class="flame"></div>
        </div>

        <div class="cream"></div>
        <div class="layer"></div>
    </div>

    <button onclick="blowCandles()">🕯️ Blow Out Candles</button>
    <button onclick="popBalloons()">🎈 Pop Balloons</button>

</div>

<script>
let candlesOff = false;

function blowCandles() {
    document.querySelectorAll(".flame").forEach(flame => {
        flame.classList.add("off");
    });

    candlesOff = true;

    createConfetti(50);

    setTimeout(() => {
        alert("🎉 Make a wish! Happy Birthday! 🎂");
    }, 300);
}

function createBalloon() {
    const balloon = document.createElement("div");

    balloon.className = "balloon";

    const colors = [
        "#ff4081",
        "#ff5252",
        "#42a5f5",
        "#66bb6a",
        "#ab47bc",
        "#ffa726",
        "#26c6da"
    ];

    balloon.style.background =
        colors[Math.floor(Math.random() * colors.length)];

    balloon.style.left =
        Math.random() * 95 + "vw";

    balloon.style.animationDuration =
        (5 + Math.random() * 4) + "s";

    document.body.appendChild(balloon);

    setTimeout(() => {
        balloon.remove();
    }, 9000);
}

for (let i = 0; i < 18; i++) {
    setTimeout(createBalloon, i * 300);
}

function popBalloons() {
    const balloons = document.querySelectorAll(".balloon");

    balloons.forEach((balloon, index) => {
        setTimeout(() => {
            balloon.classList.add("pop");
            createConfetti(12);

            setTimeout(() => {
                balloon.remove();
            }, 300);

        }, index * 100);
    });

    setTimeout(() => {
        alert("🎈💥 BOOM! 🎉 Happy Birthday! 🥳");
    }, balloons.length * 100 + 400);
}

function createConfetti(amount) {
    const colors = [
        "#ff4081",
        "#42a5f5",
        "#ffeb3b",
        "#4caf50",
        "#9c27b0",
        "#ff9800"
    ];

    for (let i = 0; i < amount; i++) {

        const confetti = document.createElement("div");

        confetti.className = "confetti";

        confetti.style.left =
            Math.random() * 100 + "vw";

        confetti.style.background =
            colors[Math.floor(Math.random() * colors.length)];

        confetti.style.animationDuration =
            (2 + Math.random() * 2) + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 4000);
    }
}
</script>

</body>
</html>
